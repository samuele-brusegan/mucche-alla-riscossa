  <!-- occhi giganti rossi -->
  <ellipse cx="28" cy="19" rx="3" ry="3.5" fill="#c00"/>
  <ellipse cx="36" cy="19" rx="3" ry="3.5" fill="#c00"/>
  <circle cx="28.5" cy="18" r="0.8" fill="#fff"/>
  <circle cx="36.5" cy="18" r="0.8" fill="#fff"/>
