  <!-- ali corte -->
  <ellipse cx="20" cy="22" rx="9" ry="5" fill="#cfd8e0" opacity="0.7" stroke="#5a6878" stroke-width="0.7"/>
  <ellipse cx="44" cy="22" rx="9" ry="5" fill="#cfd8e0" opacity="0.7" stroke="#5a6878" stroke-width="0.7"/>
  <!-- corpo grosso, guscio metallico -->
