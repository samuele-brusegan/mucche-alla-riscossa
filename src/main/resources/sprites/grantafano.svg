<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- GranTafano: enorme, scava sottoterra sotto al 50% -->
  <!-- mucchietto di terra ai lati per suggerire lo scavo -->
  <path d="M4 56 Q10 50 16 56 Z" fill="#7a4a20" opacity="0.8"/>
  <path d="M48 56 Q54 50 60 56 Z" fill="#7a4a20" opacity="0.8"/>
  <!-- ali grandi -->
  <ellipse cx="18" cy="22" rx="11" ry="6" fill="#c8a888" opacity="0.65" stroke="#7a5a3a" stroke-width="0.7"/>
  <ellipse cx="46" cy="22" rx="11" ry="6" fill="#c8a888" opacity="0.65" stroke="#7a5a3a" stroke-width="0.7"/>
  <!-- corpo enorme -->
  <ellipse cx="32" cy="38" rx="20" ry="15" fill="#5a3010"/>
  <!-- bande -->
  <path d="M14 34 Q32 30 50 34" stroke="#3a1a08" stroke-width="2" fill="none"/>
  <path d="M14 42 Q32 46 50 42" stroke="#3a1a08" stroke-width="2" fill="none"/>
  <!-- peluria -->
  <circle cx="20" cy="32" r="1" fill="#8a5a30"/>
  <circle cx="44" cy="32" r="1" fill="#8a5a30"/>
  <circle cx="32" cy="38" r="1" fill="#8a5a30"/>
  <!-- testa -->
  <circle cx="32" cy="20" r="8" fill="#3a1a08"/>
  <!-- occhi composti enormi -->
  <ellipse cx="27" cy="19" rx="3.5" ry="4" fill="#a83000"/>
  <ellipse cx="37" cy="19" rx="3.5" ry="4" fill="#a83000"/>
  <circle cx="27" cy="18" r="0.7" fill="#fff"/>
  <circle cx="37" cy="18" r="0.7" fill="#fff"/>
  <!-- proboscide pungente -->
  <path d="M32 27 L32 34" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <polygon points="32,34 30,31 34,31" fill="#1a1a1a"/>
  <!-- antenne -->
  <path d="M28 14 Q24 8 22 10" stroke="#3a1a08" stroke-width="1.2" fill="none"/>
  <path d="M36 14 Q40 8 42 10" stroke="#3a1a08" stroke-width="1.2" fill="none"/>
  <!-- zampe poderose -->
  <path d="M14 44 L4 52 M16 50 L8 58 M50 44 L60 52 M48 50 L56 58" stroke="#1a0a04" stroke-width="2" stroke-linecap="round"/>
</svg>
