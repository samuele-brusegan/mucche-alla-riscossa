<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Stalla / torre di controllo: fienile rosso classico -->
  <!-- prato sotto -->
  <rect y="56" width="64" height="8" fill="#7ec850"/>
  <!-- corpo fienile -->
  <rect x="8" y="24" width="48" height="32" fill="#b22222" stroke="#5a0000" stroke-width="1.5"/>
  <!-- tetto -->
  <polygon points="4,26 32,8 60,26" fill="#7a1414" stroke="#3a0000" stroke-width="1.5"/>
  <!-- fienile bianco a X -->
  <rect x="22" y="32" width="20" height="20" fill="#f6f1e2" stroke="#5a0000" stroke-width="1.2"/>
  <path d="M22 32 L42 52 M42 32 L22 52" stroke="#5a0000" stroke-width="1.4"/>
  <!-- finestrella tonda sul tetto -->
  <circle cx="32" cy="20" r="3" fill="#f6f1e2" stroke="#3a0000" stroke-width="1"/>
  <line x1="29" y1="20" x2="35" y2="20" stroke="#3a0000" stroke-width="0.8"/>
  <line x1="32" y1="17" x2="32" y2="23" stroke="#3a0000" stroke-width="0.8"/>
  <!-- banderuola -->
  <line x1="32" y1="8" x2="32" y2="2" stroke="#3a0000" stroke-width="1"/>
  <polygon points="32,2 38,4 32,6" fill="#d4af37"/>
  <!-- assi laterali -->
  <line x1="14" y1="24" x2="14" y2="56" stroke="#5a0000" stroke-width="1"/>
  <line x1="50" y1="24" x2="50" y2="56" stroke="#5a0000" stroke-width="1"/>
</svg>
